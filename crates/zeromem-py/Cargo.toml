[package]
name = "zeromem-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings for zeromem"

[lib]
name = "zeromem"
crate-type = ["cdylib"]

[features]
default = ["fastembed"]
fastembed = ["zeromem/fastembed"]

[dependencies]
zeromem = { path = "../zeromem", default-features = false }
pyo3 = { version = "0.22", features = ["abi3-py39", "extension-module"] }
serde_json = "1"
