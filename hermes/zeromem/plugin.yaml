name: zeromem
version: 0.4.1
requires_hermes: ">=0.22.0"
description: "Local memory that keeps every message word for word in one SQLite file. Storing and searching make no LLM calls and cost zero tokens."
author: Panat Taranat
provides_tools:
  - zeromem_recall
  - zeromem_stats
  - zeromem_forget_session
dependencies: []
python_dependencies:
  - zeromem>=0.4,<0.5
